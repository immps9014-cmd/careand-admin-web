<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Care& 보호자앱 · 새 매칭 요청 개선 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  html,body{margin:0;background:#EEF0F4;font-family:Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:54px;padding:48px 32px;flex-wrap:wrap;}
  button{transition:transform .1s ease, filter .13s ease;}
  button:active{transform:scale(.97);}
  .specs{width:330px;max-width:90vw;}
  .specs .lead{font-size:12px;font-weight:800;letter-spacing:.08em;color:#5E54C8;text-transform:uppercase;}
  .specs h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px;color:#181B27;}
  .specs p.sub{font-size:13.5px;color:#5B6172;line-height:1.6;margin:0 0 22px;}
  .imp{display:flex;gap:13px;margin-bottom:18px;}
  .imp .n{width:26px;height:26px;border-radius:50%;background:#5E54C8;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(94,84,200,.35);}
  .imp .t{font-size:14px;font-weight:800;color:#181B27;}
  .imp .d{font-size:12.5px;color:#5B6172;line-height:1.55;margin-top:3px;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
const { useState } = React;
const P='#5E54C8', PSOFT='#ECEBF8', INK='#181B27', INK2='#5B6172', INK3='#9097A6', LINE='#ECEEF2', LINE2='#E2E5EB';

function Svc({icon,t,s,on,onClick}){
  return (
    <div onClick={onClick} style={{flex:1,minWidth:0,border:`1.5px solid ${on?P:LINE2}`,background:on?PSOFT:'#fff',borderRadius:15,padding:'13px 9px',cursor:'pointer',textAlign:'center',position:'relative',transition:'.12s'}}>
      {on&&<div style={{position:'absolute',top:8,right:8,width:17,height:17,borderRadius:'50%',background:P,display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5"><path d="M5 12l5 5 9-11"/></svg></div>}
      <div style={{width:34,height:34,borderRadius:10,margin:'0 auto 8px',background:on?P:'#F1F2F5',color:on?'#fff':INK3,display:'flex',alignItems:'center',justifyContent:'center'}}>{icon}</div>
      <div style={{fontSize:12.5,fontWeight:800,color:on?P:INK,whiteSpace:'nowrap'}}>{t}</div>
      <div style={{fontSize:10,color:INK3,marginTop:3,lineHeight:1.3}}>{s}</div>
    </div>
  );
}
function Label({children}){return <div style={{fontSize:12.5,fontWeight:700,color:INK2,margin:'18px 0 8px'}}>{children}</div>;}
function Field({value,placeholder,chevron=true,date}){
  const empty=!value;
  return (
    <div style={{height:48,border:`1px solid ${LINE2}`,borderRadius:12,background:'#fff',display:'flex',alignItems:'center',padding:'0 14px',fontSize:14.5,color:empty?INK3:INK,fontWeight:empty?400:600}}>
      <span style={{flex:1}}>{value||placeholder}</span>
      {date&&<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={INK3} strokeWidth="2" style={{marginRight:6}}><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>}
      {chevron&&!date&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={INK3} strokeWidth="2.4"><path d="M6 9l6 6 6-6"/></svg>}
    </div>
  );
}
function Seg({opts,val,set}){
  return (
    <div style={{display:'flex',gap:7}}>
      {opts.map(o=>(
        <div key={o.k} onClick={()=>set(o.k)} style={{flex:1,height:44,borderRadius:11,border:`1px solid ${val===o.k?P:LINE2}`,background:val===o.k?P:'#fff',color:val===o.k?'#fff':INK2,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',cursor:'pointer',fontWeight:700,fontSize:13.5,lineHeight:1.1}}>
          {o.t}{o.s&&<span style={{fontSize:9.5,fontWeight:600,opacity:.85,marginTop:2}}>{o.s}</span>}
        </div>
      ))}
    </div>
  );
}
function Tab({icon,label,on}){
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,color:on?P:INK3}}>
      <div style={{width:24,height:24}}>{icon}</div>
      <span style={{fontSize:10,fontWeight:on?700:500}}>{label}</span>
    </div>
  );
}

function App(){
  const [svc,setSvc]=useState('senior');
  const [type,setType]=useState('normal');
  const [dur,setDur]=useState(120);
  const won=n=>n.toLocaleString('ko-KR');
  const rate=15000; // 시간당
  const cost=Math.round(dur/60*rate);
  const durChips=[{m:120,t:'2시간'},{m:240,t:'4시간'},{m:360,t:'6시간'},{m:720,t:'종일'}];

  return (
    <IOSDevice>
      <div style={{minHeight:'100%',display:'flex',flexDirection:'column',paddingTop:54,background:'#F5F6F8'}}>
        {/* app header */}
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'6px 18px 12px'}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={INK2} strokeWidth="2.4"><path d="M15 6l-6 6 6 6"/></svg>
          <div style={{width:26,height:26,borderRadius:8,background:`linear-gradient(135deg,${P},#8A7BF2)`,color:'#fff',fontWeight:800,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center'}}>C</div>
          <div style={{fontSize:15,fontWeight:800,color:INK}}>Care&amp;</div>
          <div style={{fontSize:11,fontWeight:700,color:P,background:PSOFT,borderRadius:20,padding:'2px 9px',whiteSpace:'nowrap'}}>보호자</div>
        </div>

        <div style={{flex:1,padding:'0 18px 120px'}}>
          <div style={{fontSize:23,fontWeight:800,letterSpacing:'-.02em',color:INK}}>새 매칭 요청</div>
          <div style={{fontSize:13,color:INK2,marginTop:5,lineHeight:1.5}}>돌봄 대상과 일정만 알려주시면, AI가 가장 잘 맞는 인력을 찾아 드려요.</div>

          <Label>어떤 서비스가 필요하세요?</Label>
          <div style={{display:'flex',gap:9}}>
            <Svc on={svc==='senior'} onClick={()=>setSvc('senior')} t="시니어 돌봄" s="어르신 방문" icon={<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 21s-7-4.3-7-9.5A3.5 3.5 0 0112 8a3.5 3.5 0 017 3.5C19 16.7 12 21 12 21z"/></svg>}/>
            <Svc on={svc==='care'} onClick={()=>setSvc('care')} t="병원 간병" s="입원 환자" icon={<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 4v6m-3-3h6M5 20V8l7-4 7 4v12"/></svg>}/>
            <Svc on={svc==='house'} onClick={()=>setSvc('house')} t="가사 서비스" s="청소·정리" icon={<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 21h18M6 21V11l6-5 6 5v10M10 21v-5h4v5"/></svg>}/>
          </div>

          {/* form card */}
          <div style={{background:'#fff',border:`1px solid ${LINE}`,borderRadius:18,padding:'4px 16px 18px',marginTop:18,boxShadow:'0 1px 2px rgba(24,27,39,.04),0 4px 16px rgba(24,27,39,.05)'}}>
            <Label>돌봄 대상</Label>
            <Field value="어머니 · 김순자 (82)" />
            <Label>유형</Label>
            <Seg val={type} set={setType} opts={[{k:'normal',t:'일반'},{k:'urgent',t:'긴급',s:'+20%'},{k:'regular',t:'정기',s:'-10%'}]}/>
            <Label>시작 일시</Label>
            <Field value="2026. 6. 15 (월) 오전 9:00" date />
            <Label>소요 시간</Label>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
              <button onClick={()=>setDur(Math.max(60,dur-60))} style={{width:44,height:44,borderRadius:12,border:`1px solid ${LINE2}`,background:'#fff',fontSize:22,color:INK2,cursor:'pointer'}}>−</button>
              <div style={{flex:1,textAlign:'center'}}><span style={{fontSize:22,fontWeight:800,color:INK}}>{dur}</span><span style={{fontSize:13,color:INK3,fontWeight:600}}> 분 · {(dur/60).toFixed(dur%60?1:0)}시간</span></div>
              <button onClick={()=>setDur(Math.min(720,dur+60))} style={{width:44,height:44,borderRadius:12,border:`1px solid ${LINE2}`,background:'#fff',fontSize:22,color:INK2,cursor:'pointer'}}>+</button>
            </div>
            <div style={{display:'flex',gap:7}}>
              {durChips.map(c=>(<div key={c.m} onClick={()=>setDur(c.m)} style={{flex:1,height:34,borderRadius:9,border:`1px solid ${dur===c.m?P:LINE2}`,background:dur===c.m?PSOFT:'#fff',color:dur===c.m?P:INK2,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,cursor:'pointer'}}>{c.t}</div>))}
            </div>
            <Label>요청사항 (선택)</Label>
            <div style={{minHeight:64,border:`1px solid ${LINE2}`,borderRadius:12,background:'#fff',padding:'11px 14px',fontSize:13.5,color:INK3}}>특이사항이나 요청사항을 입력하세요</div>
          </div>

          {/* cost estimate */}
          <div style={{display:'flex',alignItems:'center',gap:12,background:'#fff',border:`1px solid ${LINE}`,borderRadius:16,padding:'15px 17px',marginTop:14,boxShadow:'0 1px 2px rgba(24,27,39,.04),0 4px 16px rgba(24,27,39,.05)'}}>
            <div style={{width:40,height:40,borderRadius:11,background:'#E6F5ED',color:'#1F7A50',display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v20M16 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H7"/></svg></div>
            <div style={{flex:1}}>
              <div style={{fontSize:11.5,color:INK3,fontWeight:600}}>예상 비용 {type==='urgent'?'(긴급 +20%)':type==='regular'?'(정기 −10%)':''}</div>
              <div style={{fontSize:19,fontWeight:800,color:INK,marginTop:2}}>₩ {won(type==='urgent'?Math.round(cost*1.2):type==='regular'?Math.round(cost*0.9):cost)}<span style={{fontSize:12,color:INK3,fontWeight:600}}> · {(dur/60).toFixed(dur%60?1:0)}시간 기준</span></div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:7,marginTop:11,fontSize:11.5,color:INK3}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={P} strokeWidth="2"><path d="M12 3l2.1 4.8L19 9l-3.5 3.3L16.3 18 12 15.3 7.7 18l.8-5.7L5 9l4.9-1.2z"/></svg>
            평균 <b style={{color:INK2,margin:'0 3px'}}>23분</b> 안에 잘 맞는 후보 3~5명을 추천해 드려요.
          </div>
        </div>

        {/* sticky footer: CTA + tabbar */}
        <div style={{position:'sticky',bottom:0,background:'rgba(255,255,255,.92)',backdropFilter:'blur(10px)',borderTop:`1px solid ${LINE}`}}>
          <div style={{padding:'12px 18px 10px'}}>
            <button style={{width:'100%',height:52,borderRadius:14,border:'none',background:`linear-gradient(135deg,${P},#8A7BF2)`,color:'#fff',fontSize:16,fontWeight:800,cursor:'pointer',boxShadow:'0 8px 20px rgba(109,93,232,.35)',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2"><path d="M12 3l2.1 4.8L19 9l-3.5 3.3L16.3 18 12 15.3 7.7 18l.8-5.7L5 9l4.9-1.2z"/></svg>
              AI 매칭 요청하기
            </button>
          </div>
          <div style={{display:'flex',padding:'4px 8px 26px'}}>
            <Tab on label="홈" icon={<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg>}/>
            <Tab label="매칭" icon={<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>}/>
            <Tab label="케어일지" icon={<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 2h8l4 4v16H6z"/><path d="M9 13h6M9 17h4"/></svg>}/>
            <Tab label="알림" icon={<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 9a6 6 0 00-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10 20a2 2 0 004 0"/></svg>}/>
            <Tab label="내정보" icon={<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-3.5 3.4-5.5 7-5.5s6.3 2 7 5.5"/></svg>}/>
          </div>
        </div>
      </div>
    </IOSDevice>
  );
}

function Specs(){
  const items=[
    ['1','하단 탭 7개 → 5개로 정리','홈·어르신·환자·주소·케어일지·알림·내정보 7개를 홈·매칭·케어일지·알림·내정보 5개로. 모바일 권장 개수에 맞추고 \'주소\'·\'환자\' 같은 모호한 탭을 정리했습니다.'],
    ['2','소요 시간 — 시니어 친화 입력','숫자 직접 입력 대신 −/+ 스테퍼와 2/4/6시간·종일 빠른 선택 칩을 더해, 큰 터치 영역으로 쉽게 고르게 했습니다.'],
    ['3','요청 전 예상 비용·추천 미리보기','유형(일반/긴급/정기)에 따른 예상 비용과 \'평균 23분 내 후보 추천\' 안내를 버튼 위에 두어, 보내기 전에 결과를 가늠하게 했습니다.'],
    ['4','상시 노출 CTA + 큰 터치 영역','\'AI 매칭 요청\'을 하단 고정 버튼으로 올리고, 모든 입력 높이를 44–52px로 키워 어르신·보호자가 쉽게 누르게 했습니다.'],
  ];
  return (
    <div className="specs">
      <div className="lead">보호자 앱 · 개선 시안</div>
      <h2>새 매칭 요청</h2>
      <p className="sub">관리자 콘솔과 짝을 이루는 보호자용 모바일 화면입니다. 시니어 사용층을 고려해 입력을 쉽게, 결과를 예측 가능하게 다듬었습니다.</p>
      {items.map(it=>(<div className="imp" key={it[0]}><div className="n">{it[0]}</div><div><div className="t">{it[1]}</div><div className="d">{it[2]}</div></div></div>))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="stage"><App/><Specs/></div>
);
</script>
</body>
</html>
