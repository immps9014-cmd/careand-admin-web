<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Care& 인력앱 · 케어 플로우 개선 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  html,body{margin:0;background:#EEF0F4;font-family:Pretendard,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:50px;padding:48px 32px;flex-wrap:wrap;}
  button{transition:transform .1s ease, filter .13s ease;}
  button:active{transform:scale(.97);}
  .specs{width:340px;max-width:90vw;}
  .specs .lead{font-size:12px;font-weight:800;letter-spacing:.08em;color:#0E9C8A;text-transform:uppercase;}
  .specs h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 6px;color:#181B27;}
  .specs p.sub{font-size:13.5px;color:#5B6172;line-height:1.6;margin:0 0 18px;}
  .steps{display:flex;gap:7px;margin-bottom:20px;}
  .steps button{flex:1;border:1px solid #E2E5EB;background:#fff;border-radius:10px;padding:9px 6px;font-family:inherit;font-size:11.5px;font-weight:700;color:#5B6172;cursor:pointer;line-height:1.3;}
  .steps button.on{background:#0E9C8A;border-color:#0E9C8A;color:#fff;}
  .imp{display:flex;gap:13px;margin-bottom:16px;}
  .imp .n{width:26px;height:26px;border-radius:50%;background:#0E9C8A;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(14,156,138,.3);}
  .imp .t{font-size:14px;font-weight:800;color:#181B27;}
  .imp .d{font-size:12.5px;color:#5B6172;line-height:1.55;margin-top:3px;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const T='#0E9C8A', TSOFT='#E2F6F2', P='#5E54C8', INK='#181B27', INK2='#5B6172', INK3='#9097A6', LINE='#ECEEF2', LINE2='#E2E5EB', OKD='#1F7A50', CRIT='#E5484D';

function Header({title}){
  return (
    <div style={{padding:'6px 18px 10px',borderBottom:`1px solid ${LINE}`,background:'#fff'}}>
      <div style={{display:'flex',alignItems:'center',gap:9}}>
        <div style={{width:26,height:26,borderRadius:8,background:`linear-gradient(135deg,${P},#8A7BF2)`,color:'#fff',fontWeight:800,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center'}}>C</div>
        <div style={{fontSize:15,fontWeight:800,color:INK}}>Care&amp;</div>
        <div style={{fontSize:11,fontWeight:700,color:T,background:TSOFT,borderRadius:20,padding:'2px 9px',whiteSpace:'nowrap'}}>케어 인력</div>
        <div style={{marginLeft:'auto',fontSize:12.5,fontWeight:700,color:INK2}}>{title}</div>
      </div>
    </div>
  );
}
function InfoCard(){
  return (
    <div style={{display:'flex',gap:12,alignItems:'center',background:'#fff',border:`1px solid ${LINE}`,borderRadius:16,padding:14}}>
      <div style={{width:46,height:46,borderRadius:13,background:`linear-gradient(135deg,${P},#8A7BF2)`,color:'#fff',fontWeight:800,fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>김</div>
      <div style={{flex:1}}>
        <div style={{fontSize:15.5,fontWeight:800,color:INK}}>김순자 어르신 <span style={{fontSize:12,fontWeight:600,color:INK3}}>82 · 여</span></div>
        <div style={{fontSize:12,color:INK2,marginTop:3}}>시니어 돌봄 · 경기 화성시 동탄</div>
      </div>
      <div style={{width:34,height:34,borderRadius:10,border:`1px solid ${LINE2}`,display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T} strokeWidth="2"><path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></div>
    </div>
  );
}
function Row({k,v,strong}){
  return <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'11px 0',borderBottom:`1px solid ${LINE}`}}><span style={{fontSize:13,color:INK2}}>{k}</span><span style={{fontSize:strong?15:13.5,fontWeight:strong?800:600,color:strong?INK:INK}}>{v}</span></div>;
}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':');}

// ───── Screen 1: 일정 수락 ─────
function Schedule({go}){
  return (
    <div style={{padding:'16px 18px 30px'}}>
      <div style={{fontSize:22,fontWeight:800,color:INK,letterSpacing:'-.02em'}}>오늘 일정</div>
      <div style={{fontSize:13,color:INK2,marginTop:4}}>2026년 6월 15일 (월) · 수락 대기 1건</div>

      <div style={{background:'#fff',border:`1.5px solid ${T}`,borderRadius:18,padding:16,marginTop:16,boxShadow:'0 6px 20px rgba(14,156,138,.12)'}}>
        <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:13}}>
          <span style={{fontSize:11,fontWeight:800,color:'#fff',background:T,borderRadius:6,padding:'2px 8px',whiteSpace:'nowrap'}}>새 요청</span>
          <span style={{fontSize:11.5,color:INK3,fontWeight:600}}>방금 · AI 추천 매칭</span>
        </div>
        <InfoCard/>
        <div style={{marginTop:6}}>
          <Row k="일시" v="6/15 (월) 오전 9:00"/>
          <Row k="소요 시간" v="2시간 (09:00–11:00)"/>
          <Row k="이동 거리" v="내 위치에서 3.2km"/>
          <Row k="예상 수당" v="₩ 28,000" strong/>
        </div>
        <div style={{display:'flex',gap:9,marginTop:15}}>
          <button style={{flex:1,height:50,borderRadius:13,border:`1px solid ${LINE2}`,background:'#fff',color:INK2,fontSize:15,fontWeight:700,fontFamily:'inherit',cursor:'pointer'}}>거절</button>
          <button onClick={()=>go('care')} style={{flex:2,height:50,borderRadius:13,border:'none',background:T,color:'#fff',fontSize:15.5,fontWeight:800,fontFamily:'inherit',cursor:'pointer',boxShadow:'0 8px 18px rgba(14,156,138,.32)'}}>수락하기</button>
        </div>
      </div>

      <div style={{fontSize:12.5,fontWeight:800,color:INK3,letterSpacing:'.02em',margin:'22px 0 10px'}}>확정된 방문</div>
      <div style={{background:'#fff',border:`1px solid ${LINE}`,borderRadius:14,padding:'13px 15px',display:'flex',alignItems:'center',gap:12,opacity:.85}}>
        <div style={{textAlign:'center',width:42,flex:'none'}}><div style={{fontSize:17,fontWeight:800,color:INK}}>14:00</div><div style={{fontSize:10,color:INK3}}>오후</div></div>
        <div style={{width:1,height:34,background:LINE2}}></div>
        <div style={{flex:1}}><div style={{fontSize:13.5,fontWeight:700,color:INK}}>박정호 어르신</div><div style={{fontSize:11.5,color:INK3,marginTop:2}}>시니어 돌봄 · 3시간</div></div>
        <span style={{fontSize:11,fontWeight:700,color:P,background:'#EFEDFC',borderRadius:20,padding:'3px 10px'}}>예정</span>
      </div>
    </div>
  );
}

// ───── Screen 2: 케어 진행 (시작/종료) ─────
function Care({go}){
  const [running,setRunning]=useState(false);
  const [sec,setSec]=useState(0);
  const ref=useRef();
  useEffect(()=>{ if(running){ref.current=setInterval(()=>setSec(s=>s+1),1000);} return ()=>clearInterval(ref.current); },[running]);
  return (
    <div style={{padding:'16px 18px 30px'}}>
      <div style={{fontSize:22,fontWeight:800,color:INK,letterSpacing:'-.02em'}}>케어 진행</div>
      <div style={{fontSize:13,color:INK2,marginTop:4}}>6/15 (월) 09:00 방문 · 2시간 예정</div>

      <div style={{marginTop:16}}><InfoCard/></div>

      {/* GPS 도착 확인 */}
      <div style={{display:'flex',alignItems:'center',gap:10,background:TSOFT,border:`1px solid #BFE9E1`,borderRadius:13,padding:'12px 14px',marginTop:13}}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={OKD} strokeWidth="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:800,color:OKD}}>방문지 도착 확인됨</div><div style={{fontSize:11,color:INK2,marginTop:1}}>GPS 위치가 케어 주소와 일치합니다 (08:57)</div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={OKD} strokeWidth="2.5"><path d="M5 12l5 5 9-11"/></svg>
      </div>

      {/* timer */}
      <div style={{textAlign:'center',background:'#fff',border:`1px solid ${LINE}`,borderRadius:18,padding:'26px 18px',marginTop:14,boxShadow:'0 1px 2px rgba(24,27,39,.04),0 4px 16px rgba(24,27,39,.05)'}}>
        <div style={{fontSize:12,fontWeight:700,color:running?T:INK3,letterSpacing:'.04em'}}>{running?'● 케어 진행 중':'케어 시작 전'}</div>
        <div style={{fontSize:46,fontWeight:800,letterSpacing:'.02em',color:INK,fontVariantNumeric:'tabular-nums',margin:'8px 0 4px'}}>{fmt(sec)}</div>
        <div style={{fontSize:12,color:INK3}}>{running?'예정 종료 11:00 · 잔여 '+fmt(Math.max(0,7200-sec)):'시작 버튼을 누르면 기록이 시작됩니다'}</div>
        {!running
          ? <button onClick={()=>setRunning(true)} style={{width:'100%',height:52,borderRadius:14,border:'none',background:T,color:'#fff',fontSize:16,fontWeight:800,fontFamily:'inherit',cursor:'pointer',marginTop:18,boxShadow:'0 8px 18px rgba(14,156,138,.32)'}}>케어 시작</button>
          : <button onClick={()=>go('log')} style={{width:'100%',height:52,borderRadius:14,border:`1.5px solid ${CRIT}`,background:'#fff',color:CRIT,fontSize:16,fontWeight:800,fontFamily:'inherit',cursor:'pointer',marginTop:18}}>케어 종료</button>}
      </div>

      {/* checklist */}
      <div style={{fontSize:12.5,fontWeight:800,color:INK3,margin:'20px 0 10px'}}>케어 체크리스트</div>
      {[['방문지 도착',true],['케어 진행',running],['일지 작성 후 종료',false]].map((c,i)=>(
        <div key={i} style={{display:'flex',alignItems:'center',gap:11,padding:'10px 0'}}>
          <div style={{width:22,height:22,borderRadius:'50%',border:`2px solid ${c[1]?T:LINE2}`,background:c[1]?T:'#fff',display:'flex',alignItems:'center',justifyContent:'center',flex:'none'}}>{c[1]&&<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5"><path d="M5 12l5 5 9-11"/></svg>}</div>
          <span style={{fontSize:14,fontWeight:600,color:c[1]?INK:INK3}}>{c[0]}</span>
        </div>
      ))}
    </div>
  );
}

// ───── Screen 3: 일지 작성 ─────
function Log({go}){
  const fields=[
    ['활동 내용','근처 공원 산책 30분, 그림 맞추기 인지활동 진행'],
    ['식사','점심 식사 8할 섭취 (잡곡밥, 된장국)'],
    ['투약','혈압약 1정 복용 확인 (10:10)'],
    ['특이사항','오른쪽 무릎 통증을 가볍게 호소하셨으나 보행 지장 없음'],
  ];
  return (
    <div style={{padding:'16px 18px 30px'}}>
      <div style={{fontSize:22,fontWeight:800,color:INK,letterSpacing:'-.02em'}}>케어 일지 작성</div>
      <div style={{fontSize:13,color:INK2,marginTop:4}}>김순자 어르신 · 6/15 09:00–11:00 (2시간)</div>

      {/* AI draft banner */}
      <div style={{display:'flex',alignItems:'center',gap:10,background:'#EFEDFC',border:'1px solid #DAD3FA',borderRadius:13,padding:'12px 14px',marginTop:15}}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={P} strokeWidth="2"><path d="M12 3l2.1 4.8L19 9l-3.5 3.3L16.3 18 12 15.3 7.7 18l.8-5.7L5 9l4.9-1.2z"/></svg>
        <div style={{flex:1,fontSize:12.5,color:INK2,lineHeight:1.45}}><b style={{color:P}}>C:Writer가 초안을 미리 작성했어요.</b> 내용만 확인하고 다듬어 주세요.</div>
      </div>

      {fields.map((f,i)=>(
        <div key={i} style={{marginTop:14}}>
          <div style={{fontSize:12.5,fontWeight:700,color:INK2,marginBottom:7,display:'flex',alignItems:'center',gap:6}}>{f[0]}<span style={{fontSize:9.5,fontWeight:800,color:P,background:'#EFEDFC',borderRadius:5,padding:'1px 6px',whiteSpace:'nowrap'}}>AI 초안</span></div>
          <div style={{border:`1px solid ${LINE2}`,borderRadius:12,background:'#fff',padding:'11px 13px',fontSize:13.5,color:INK,lineHeight:1.5}}>{f[1]}</div>
        </div>
      ))}

      <div style={{fontSize:12.5,fontWeight:700,color:INK2,margin:'16px 0 8px'}}>사진 첨부</div>
      <div style={{display:'flex',gap:9}}>
        <div style={{width:70,height:70,borderRadius:12,background:'linear-gradient(135deg,#E7E3F8,#D7E6F5)',display:'flex',alignItems:'center',justifyContent:'center',color:'#9b8ed6'}}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M3 17l5-4 4 3 3-2 6 5"/></svg></div>
        <div style={{width:70,height:70,borderRadius:12,border:`1.5px dashed ${LINE2}`,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:INK3,gap:3}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg><span style={{fontSize:10}}>추가</span></div>
      </div>

      <button onClick={()=>go('done')} style={{width:'100%',height:52,borderRadius:14,border:'none',background:T,color:'#fff',fontSize:16,fontWeight:800,fontFamily:'inherit',cursor:'pointer',marginTop:22,boxShadow:'0 8px 18px rgba(14,156,138,.32)'}}>일지 제출하기</button>
      <div style={{textAlign:'center',fontSize:11.5,color:INK3,marginTop:10}}>관리자 검수를 거쳐 보호자님께 전달돼요.</div>
    </div>
  );
}

// ───── Screen 4: 완료 ─────
function Done({go}){
  return (
    <div style={{padding:'60px 26px',textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',minHeight:560,justifyContent:'center'}}>
      <div style={{width:84,height:84,borderRadius:'50%',background:TSOFT,display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke={T} strokeWidth="2.5"><path d="M5 12l5 5 9-11"/></svg></div>
      <div style={{fontSize:22,fontWeight:800,color:INK,marginTop:22}}>오늘 케어, 수고하셨어요</div>
      <div style={{fontSize:13.5,color:INK2,marginTop:8,lineHeight:1.6}}>김순자 어르신 케어와 일지를<br/>모두 마치셨습니다.</div>
      <div style={{background:'#fff',border:`1px solid ${LINE}`,borderRadius:14,padding:'14px 18px',marginTop:22,width:'100%'}}>
        <div style={{display:'flex',justifyContent:'space-between',padding:'7px 0'}}><span style={{fontSize:13,color:INK2}}>케어 시간</span><span style={{fontSize:13.5,fontWeight:700,color:INK}}>2시간 03분</span></div>
        <div style={{display:'flex',justifyContent:'space-between',padding:'7px 0'}}><span style={{fontSize:13,color:INK2}}>일지 상태</span><span style={{fontSize:12.5,fontWeight:700,color:'#9A7400',background:'#FBF3DC',borderRadius:20,padding:'3px 10px'}}>검수 대기</span></div>
        <div style={{display:'flex',justifyContent:'space-between',padding:'7px 0'}}><span style={{fontSize:13,color:INK2}}>예상 정산</span><span style={{fontSize:14,fontWeight:800,color:INK}}>₩ 28,000</span></div>
      </div>
      <button onClick={()=>go('schedule')} style={{width:'100%',height:50,borderRadius:13,border:`1px solid ${LINE2}`,background:'#fff',color:INK2,fontSize:14.5,fontWeight:700,fontFamily:'inherit',cursor:'pointer',marginTop:18}}>일정으로 돌아가기</button>
    </div>
  );
}

const titles={schedule:'오늘 일정',care:'케어 진행',log:'일지 작성',done:'완료'};
function App({step,go}){
  return (
    <IOSDevice>
      <div style={{minHeight:'100%',paddingTop:54,background:'#F5F6F8'}}>
        <Header title={titles[step]}/>
        {step==='schedule'&&<Schedule go={go}/>}
        {step==='care'&&<Care go={go}/>}
        {step==='log'&&<Log go={go}/>}
        {step==='done'&&<Done go={go}/>}
      </div>
    </IOSDevice>
  );
}

function Root(){
  const [step,setStep]=useState('schedule');
  const items=[
    ['1','일정 수락 — 수당·거리·시간 한눈에','새 요청 카드에 예상 수당·이동 거리·소요 시간을 모아, 인력이 수락 여부를 즉시 판단하게 했습니다. 수락/거절 버튼을 크게 분리.'],
    ['2','케어 시작/종료 — GPS·타이머','방문지 GPS 도착 확인 후 큰 타이머로 케어 시간을 기록합니다. 0분 일지 같은 오기록을 막고, 종료는 일지 작성으로 자연스럽게 연결.'],
    ['3','AI 일지 초안 — 작성 부담 ↓','C:Writer가 활동·식사·투약·특이사항 초안을 미리 작성하고, 인력은 확인·수정·사진 첨부만. 시니어 케어 인력의 기록 부담을 크게 줄입니다.'],
    ['4','관리자 검수와 연결','제출 시 \'검수 대기\' 상태로 관리자 AI 일지 검수 화면으로 넘어가, 보호자 발송 전 품질을 보장합니다.'],
  ];
  return (
    <div className="stage">
      <App step={step} go={setStep}/>
      <div className="specs">
        <div className="lead">케어 인력 앱 · 개선 시안</div>
        <h2>케어 플로우</h2>
        <p className="sub">일정 수락부터 케어 시작/종료, 일지 작성·제출까지 하나의 흐름으로 묶은 인력용 모바일 화면입니다. 폰을 직접 조작해 보거나 아래에서 단계를 골라보세요.</p>
        <div className="steps">
          {[['schedule','① 일정\n수락'],['care','② 케어\n시작/종료'],['log','③ 일지\n작성'],['done','④ 완료']].map(s=>(
            <button key={s[0]} className={step===s[0]?'on':''} onClick={()=>setStep(s[0])}>{s[1].split('\n').map((l,i)=><div key={i}>{l}</div>)}</button>
          ))}
        </div>
        {items.map(it=>(<div className="imp" key={it[0]}><div className="n">{it[0]}</div><div><div className="t">{it[1]}</div><div className="d">{it[2]}</div></div></div>))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
